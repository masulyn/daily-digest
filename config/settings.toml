# Model settings. Prices are USD per million tokens (third-party-reported; checked against
# the provider's pricing page on Oct 20, 2026; claude-opus-5-5 on Oct 22, 2026).

[llm]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_usd_per_run = 0.25
max_input_tokens = 40000
max_output_tokens = 6000
max_run_input_tokens = 150000
max_run_output_tokens = 20000
max_review_rounds = 3
request_timeout_seconds = 60

[llm.prices.claude-sonnet-5-5]
input_per_mtok = 2.0
output_per_mtok = 10.0

# Opus 5.5 is the judge for the eval suite: a different model from the generator.
[llm.prices.claude-opus-5-5]
input_per_mtok = 4.0
output_per_mtok = 20.0

[eval]
judge_model = "claude-opus-5-5"
max_usd_per_eval = 2.00   # generator and judge calls together; no new case starts if it could cross
max_usd_per_judge = 0.20  # one judged case
