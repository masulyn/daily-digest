# Starter RSS feeds for enterprise AI adoption.
# Tested for reachability and robots.txt on Oct 14-15, 2026.
#
# Links in a feed are untrusted, so each feed may link only to its allowed domains (and their
# subdomains). Without `allowed_domains` that is the feed's own registrable domain, for example
# cio.com for www.cio.com. A feed that legitimately links elsewhere lists the domains it needs.

[[feeds]]
name = "CIO.com AI"
url = "https://www.cio.com/artificial-intelligence/feed/"
category = "enterprise IT press"
enabled = true

[[feeds]]
name = "MIT Sloan Management Review AI"
url = "https://sloanreview.mit.edu/tag/artificial-intelligence/feed/"
category = "management research"
enabled = true

[[feeds]]
name = "MIT Technology Review AI"
url = "https://www.technologyreview.com/topic/artificial-intelligence/feed"
category = "technology analysis"
enabled = true

[[feeds]]
name = "Google Cloud AI blog"
url = "https://cloudblog.withgoogle.com/products/ai-machine-learning/rss/"
category = "vendor blog"
enabled = true
# The feed is served from withgoogle.com, but its items link to cloud.google.com.
allowed_domains = ["cloud.google.com", "cloudblog.withgoogle.com"]

# Replaced CIO Dive: its article pages block our HTTP client, so only headlines were usable.
[[feeds]]
name = "Computerworld generative AI"
url = "https://www.computerworld.com/generative-ai/feed/"
category = "enterprise IT press"
enabled = true
