[project]
name = "daily-digest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "trafilatura>=2.3.1",
]

[project.scripts]
daily-digest = "daily_digest:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
]
