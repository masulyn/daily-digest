<text x="490.0" y="42" font-size="11" font-weight="400" fill="#59636E" text-anchor="middle" >127.0.0.1:8000/newsletters/2026-10-15</text>
<text x="50" y="96" font-size="22" font-weight="700" fill="#1F2328" text-anchor="start" >Daily Digest</text>
<circle cx="710" cy="91" r="4.5" fill="#1A7F37" stroke="none" stroke-width="1"/>
<text x="720" y="95" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >Last run: Oct 16, 9:12 AM · Success</text>
<line x1="20" y1="118" x2="960" y2="118" stroke="#D0D7DE" stroke-width="1"/>
<text x="50" y="152" font-size="13" font-weight="600" fill="#1F4FD8" text-anchor="start" >← All digests</text>
<text x="50" y="182" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >Thu, Oct 15  ·  2 min read  ·  Generated Oct 16, 9:12 AM</text>
<text x="50" y="222" font-size="25" font-weight="700" fill="#1F2328" text-anchor="start" >Sample headline: one line summarizing the day</text>
<text x="50" y="262" font-size="16" font-weight="700" fill="#1F2328" text-anchor="start" >What you need to know</text>
<text x="50" y="288" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start" >Sample sentence describing a trend that several sources report. Trend statements are</text>
<text x="50" y="310" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start" >not cited. Sample sentence describing a second trend supported by multiple sources.</text>
<text x="50" y="344" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start" >Sample sentence about a third development, again stated without a citation marker.</text>
<text x="50" y="400" font-size="16" font-weight="700" fill="#1F2328" text-anchor="start" >Worth a closer look</text>
<text x="50" y="426" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start" >Sample attributed viewpoint: “Sample verbatim quote from a named person.” [1] says the point.</text>
<text x="50" y="448" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start" >Sample specific statistic reported by a named organization. [2]</text>
<text x="50" y="486" font-size="16" font-weight="700" fill="#1F2328" text-anchor="start" >Sources</text>
<line x1="50" y1="494" x2="930" y2="494" stroke="#D0D7DE" stroke-width="1"/>
<text x="50" y="518" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >[1]  Sample article title — Publisher, Author · Oct 15, 2026 · example.com/article-1</text>
<text x="50" y="540" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >[2]  Sample report title — Organization · Oct 15, 2026 · example.com/report-2</text>
<line x1="20" y1="756" x2="960" y2="756" stroke="#D0D7DE" stroke-width="1"/>
<text x="50" y="786" font-size="13" font-weight="600" fill="#1F4FD8" text-anchor="start" >← Previous · Wed, Oct 14</text>
<text x="930" y="786" font-size="13" font-weight="400" fill="#8B949E" text-anchor="end" >Next → (none yet)</text>
<text x="50" y="826" font-size="11" font-weight="400" fill="#8B949E" text-anchor="start" >Illustrative sample content only. Headlines and text are placeholders, not real news.</text>
<circle cx="34" cy="178" r="11" fill="#D9363E" stroke="none" stroke-width="1"/>
<text x="34" y="182.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<circle cx="312" cy="256" r="11" fill="#D9363E" stroke="none" stroke-width="1"/>
<text x="312" y="260.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<circle cx="720" cy="436" r="11" fill="#D9363E" stroke="none" stroke-width="1"/>
<text x="720" y="440.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<circle cx="34" cy="492" r="11" fill="#D9363E" stroke="none" stroke-width="1"/>
<text x="34" y="496.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<circle cx="34" cy="782" r="11" fill="#D9363E" stroke="none" stroke-width="1"/>
<text x="34" y="786.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >5</text>
<text x="990" y="60" font-size="14" font-weight="700" fill="#1F2328" text-anchor="start" >Screen 2 · Newsletter reader</text>
<circle cx="1001" cy="82" r="11" fill="#D9363E" stroke="none" stroke-width="1"/>
<text x="1001" y="86" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<text x="1022" y="86" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >Covered date is the primary label</text>
<text x="1022" y="102" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >(URL uses it). Generated-at and</text>
<text x="1022" y="118" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >reading time are secondary.</text>
<circle cx="1001" cy="142" r="11" fill="#D9363E" stroke="none" stroke-width="1"/>
<text x="1001" y="146" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<text x="1022" y="146" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >Two fixed sections: trends first,</text>
<text x="1022" y="162" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >then distinctive viewpoints.</text>
<circle cx="1001" cy="186" r="11" fill="#D9363E" stroke="none" stroke-width="1"/>
<text x="1001" y="190" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<text x="1022" y="190" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >Citation markers [n] appear only</text>
<text x="1022" y="206" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >on viewpoints, specific facts, and</text>
<text x="1022" y="222" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >quotes. Each links to its entry</text>
<text x="1022" y="238" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >under Sources. Viewpoints name</text>
<text x="1022" y="254" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >their source.</text>
<circle cx="1001" cy="278" r="11" fill="#D9363E" stroke="none" stroke-width="1"/>
<text x="1001" y="282" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<text x="1022" y="282" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >Sources: title, publisher, author,</text>
<text x="1022" y="298" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >date, link (opens a new tab).</text>
<text x="1022" y="314" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >Exactly the sources cited, no</text>
<text x="1022" y="330" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >more.</text>
<circle cx="1001" cy="354" r="11" fill="#D9363E" stroke="none" stroke-width="1"/>
<text x="1001" y="358" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >5</text>
<text x="1022" y="358" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >Previous / Next move through the</text>
<text x="1022" y="374" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >archive; Next is disabled on the</text>
<text x="1022" y="390" font-size="12" font-weight="400" fill="#59636E" text-anchor="start" >latest digest.</text>
</svg>
