name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      # Tests must use the mock LLM provider and saved feed fixtures.
      # CI never gets an API key and never calls a paid model.
      - name: Run tests
        run: uv run pytest
